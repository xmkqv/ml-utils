[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ml-utils"
version = "0.1.0"
description = "Typed PyTorch utilities for training, evaluation, and experiment tracking"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
keywords = ["machine-learning", "pytorch", "lightning", "experiment-tracking"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "expression>=5.0.0",
    "imbalanced-learn>=0.12.0",
    "psutil>=5.9.0",
    "lightning>=2.5.0",
    "scikit-learn>=1.3.0",
    "torch>=2.4.0",
    "torchinfo>=1.8.0",
    "torchmetrics>=1.0.0",
    "wandb>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pyright>=1.1.411",
    "ruff>=0.1.0",
]
tuning = [
    "torch-lr-finder>=0.2.1",
]

[project.urls]
Repository = "https://github.com/xmkqv/ml-utils"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.13"
include = ["ml_utils"]

[tool.hatch.build.targets.wheel]
packages = ["ml_utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
